name: Build ornament packs

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write   # needed for creating releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install pyyaml

      - name: Build packs
        run: python scripts/build_packs.py

      - name: Publish releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r rel; do
            tag=$(jq -r .tag <<<"$rel")
            title=$(jq -r .title <<<"$rel")
            notes=$(jq -r .notes <<<"$rel")
            mapfile -t files < <(jq -r '.files[]' <<<"$rel")

            if gh release view "$tag" >/dev/null 2>&1 </dev/null; then
              gh release edit "$tag" --title "$title" --notes "$notes" </dev/null
              gh release upload "$tag" "${files[@]}" --clobber </dev/null
            else
              gh release create "$tag" "${files[@]}" \
                --title "$title" --notes "$notes" --target "$GITHUB_SHA" </dev/null
            fi
          done < <(jq -c '.[]' dist/releases.json)

      - name: Upload preview site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
